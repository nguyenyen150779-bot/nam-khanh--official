<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nam Khánh - Hệ Sinh Thái Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --matcha-bg: #F7F9F6;
            --matcha-primary: #94B49F;
            --matcha-dark: #4A6B53;
            --matcha-light: #D8E2DC;
        }
        body {
            background-color: var(--matcha-bg);
            color: #333333;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100dvh;
            overflow: hidden;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-[#D8E2DC] px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center gap-2 cursor-pointer" onclick="loadVideos()">
            <div class="w-8 h-8 rounded-full bg-[#94B49F] flex items-center justify-center text-white font-bold text-sm">NK</div>
            <h1 class="text-lg font-bold tracking-tight text-[#4A6B53]">Nam Khánh</h1>
        </div>
        
        <!-- Ô tìm kiếm -->
        <div class="flex-1 max-w-xs mx-3">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterVideos()" 
                    placeholder="Tìm kiếm trong hệ sinh thái nam khánh" 
                    class="w-full bg-[#F7F9F6] text-xs rounded-full pl-8 pr-3 py-1.5 border border-[#D8E2DC] focus:outline-none focus:border-[#94B49F]">
                <i class="fas fa-search absolute left-2.5 top-2.5 text-gray-400 text-xs"></i>
            </div>
        </div>

        <!-- Nút Đăng & Avatar Nguồn -->
        <div class="flex items-center gap-2">
            <button onclick="openUploadModal()" class="bg-[#94B49F] hover:bg-[#4A6B53] text-white px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1 transition-all">
                <i class="fas fa-plus"></i> <span class="hidden sm:inline">Đăng video</span>
            </button>
            <!-- Bấm vào Avatar để Đổi Ảnh -->
            <div onclick="openProfileModal()" title="Đổi ảnh đại diện" class="w-8 h-8 rounded-full border border-[#94B49F] overflow-hidden cursor-pointer shrink-0 hover:opacity-80 transition-all">
                <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=NamKhanh" alt="Avatar" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Danh sách Video -->
    <main id="mainContent" class="flex-1 overflow-y-auto p-3 sm:p-4">
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-w-6xl mx-auto">
            <!-- Video render tự động -->
        </div>
    </main>

    <!-- Xem Video Chi Tiết -->
    <div id="videoPlayerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col">
        <div class="p-3 flex items-center justify-between text-white border-b border-gray-800">
            <button onclick="closePlayer()" class="flex items-center gap-2 text-sm text-gray-300 hover:text-white">
                <i class="fas fa-arrow-left"></i> Quay lại
            </button>
            <h2 id="playerTitle" class="text-sm font-semibold truncate max-w-md"></h2>
            <button onclick="deleteCurrentVideo()" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded border border-red-800">
                <i class="fas fa-trash"></i> Xóa Video
            </button>
        </div>
        <div class="flex-1 flex items-center justify-center p-2 bg-black">
            <div id="playerContainer" class="w-full max-w-4xl aspect-video bg-black rounded overflow-hidden flex items-center justify-center"></div>
        </div>
        <div class="p-3 bg-gray-900 text-white max-w-4xl mx-auto w-full text-xs">
            <p id="playerDesc" class="text-gray-400 text-xs"></p>
        </div>
    </div>

    <!-- Modal Đăng Video -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-xl max-w-sm w-full p-4 shadow-xl border border-[#D8E2DC]">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-[#4A6B53]">ĐĂNG VIDEO MỚI</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xs"></i></button>
            </div>
            <form onsubmit="handleUpload(event)" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-medium text-gray-700 mb-1">Tiêu đề video</label>
                    <input type="text" id="videoTitle" required class="w-full text-xs border border-[#D8E2DC] rounded-lg p-1.5 focus:outline-none focus:border-[#94B49F]">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-700 mb-1">Link YouTube</label>
                    <input type="text" id="youtubeUrl" placeholder="Dán link YouTube (VD: https://youtu.be/...)" required class="w-full text-xs border border-[#D8E2DC] rounded-lg p-1.5 focus:outline-none focus:border-[#94B49F]">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-700 mb-1">Mô tả ngắn</label>
                    <textarea id="videoDesc" rows="2" class="w-full text-xs border border-[#D8E2DC] rounded-lg p-1.5 focus:outline-none focus:border-[#94B49F]"></textarea>
                </div>
                <button type="submit" class="w-full bg-[#94B49F] hover:bg-[#4A6B53] text-white py-1.5 rounded-lg text-xs font-medium transition-all">Đăng ngay</button>
            </form>
        </div>
    </div>

    <!-- Modal Đổi Ảnh Đại Diện (Avatar) -->
    <div id="profileModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-xl max-w-xs w-full p-4 shadow-xl border border-[#D8E2DC]">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-[#4A6B53]">ĐỔI ẢNH ĐẠI DIỆN</h3>
                <button onclick="closeProfileModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xs"></i></button>
            </div>
            <div class="flex flex-col items-center mb-3">
                <div class="w-16 h-16 rounded-full border-2 border-[#94B49F] overflow-hidden mb-2">
                    <img id="avatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=NamKhanh" class="w-full h-full object-cover">
                </div>
            </div>
            <form onsubmit="handleAvatarSave(event)" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-medium text-gray-700 mb-1">Tải ảnh từ máy tính</label>
                    <input type="file" id="avatarFileInput" accept="image/*" onchange="previewAvatarFile(event)" class="w-full text-[10px] text-gray-500">
                </div>
                <div class="text-[10px] text-gray-400 text-center">- HOẶC -</div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-700 mb-1">Dán URL đường link ảnh</label>
                    <input type="text" id="avatarUrlInput" placeholder="https://..." oninput="previewAvatarUrl(this.value)" class="w-full text-xs border border-[#D8E2DC] rounded-lg p-1.5 focus:outline-none focus:border-[#94B49F]">
                </div>
                <button type="submit" class="w-full bg-[#94B49F] hover:bg-[#4A6B53] text-white py-1.5 rounded-lg text-xs font-medium transition-all">Lưu ảnh mới</button>
            </form>
        </div>
    </div>

    <script>
        let allVideos = [];
        let currentVideoId = null;
        let tempAvatarData = null;

        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Tải danh sách video
        function loadVideos() {
            const localData = JSON.parse(localStorage.getItem('nk_videos') || '[]');
            allVideos = localData;
            renderGrid(allVideos);
            loadSavedAvatar();
        }

        function renderGrid(videos) {
            const grid = document.getElementById('videoGrid');
            if (videos.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-xs text-gray-400 py-10">Chưa có video nào. Bấm "Đăng video" để thêm video đầu tiên!</div>';
                return;
            }

            grid.innerHTML = videos.map(v => {
                const ytId = getYouTubeId(v.url);
                const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : 'https://picsum.photos/400/225';
                return `
                    <div onclick="playVideo('${v.id}')" class="bg-white rounded-lg overflow-hidden border border-[#D8E2DC] hover:shadow-md cursor-pointer transition-all">
                        <div class="aspect-video bg-gray-100 relative">
                            <img src="${thumb}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                                <i class="fas fa-play-circle text-white text-3xl opacity-80"></i>
                            </div>
                        </div>
                        <div class="p-2.5">
                            <h3 class="text-xs font-semibold text-gray-800 line-clamp-1 mb-1">${v.title}</h3>
                            <p class="text-[10px] text-gray-500 line-clamp-2">${v.desc || 'Chưa có mô tả'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Đăng Video
        function handleUpload(e) {
            e.preventDefault();
            const title = document.getElementById('videoTitle').value;
            const url = document.getElementById('youtubeUrl').value;
            const desc = document.getElementById('videoDesc').value;

            const ytId = getYouTubeId(url);
            if (!ytId) {
                alert('Vui lòng dán đúng đường link YouTube!');
                return;
            }

            const newVideo = {
                id: 'v_' + Date.now(),
                title: title,
                url: url,
                desc: desc,
                createdAt: new Date().toISOString()
            };

            allVideos.unshift(newVideo);
            localStorage.setItem('nk_videos', JSON.stringify(allVideos));
            
            closeUploadModal();
            loadVideos();
            alert('Đăng video thành công!');
        }

        // Xử lý đổi Avatar
        function loadSavedAvatar() {
            const savedAvatar = localStorage.getItem('nk_user_avatar');
            if (savedAvatar) {
                document.getElementById('userAvatar').src = savedAvatar;
                document.getElementById('avatarPreview').src = savedAvatar;
            }
        }

        function previewAvatarFile(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    tempAvatarData = evt.target.result;
                    document.getElementById('avatarPreview').src = tempAvatarData;
                };
                reader.readAsDataURL(file);
            }
        }

        function previewAvatarUrl(url) {
            if (url.trim() !== '') {
                tempAvatarData = url.trim();
                document.getElementById('avatarPreview').src = tempAvatarData;
            }
        }

        function handleAvatarSave(e) {
            e.preventDefault();
            if (tempAvatarData) {
                localStorage.setItem('nk_user_avatar', tempAvatarData);
                document.getElementById('userAvatar').src = tempAvatarData;
                closeProfileModal();
                alert('Đã cập nhật ảnh đại diện thành công!');
            } else {
                alert('Vui lòng chọn ảnh hoặc dán link ảnh!');
            }
        }

        // Xử lý Player
        function playVideo(id) {
            const video = allVideos.find(v => v.id === id);
            if (!video) return;

            currentVideoId = id;
            document.getElementById('playerTitle').innerText = video.title;
            document.getElementById('playerDesc').innerText = video.desc || '';

            const ytId = getYouTubeId(video.url);
            const container = document.getElementById('playerContainer');
            container.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;

            document.getElementById('videoPlayerModal').classList.remove('hidden');
        }

        function closePlayer() {
            document.getElementById('playerContainer').innerHTML = '';
            document.getElementById('videoPlayerModal').classList.add('hidden');
        }

        function deleteCurrentVideo() {
            if (confirm('Bạn có chắc muốn xóa video này không?')) {
                allVideos = allVideos.filter(v => v.id !== currentVideoId);
                localStorage.setItem('nk_videos', JSON.stringify(allVideos));
                closePlayer();
                loadVideos();
            }
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allVideos.filter(v => v.title.toLowerCase().includes(query) || (v.desc && v.desc.toLowerCase().includes(query)));
            renderGrid(filtered);
        }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }
        function openProfileModal() { document.getElementById('profileModal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

        window.onload = loadVideos;
    </script>
</body>
</html>
